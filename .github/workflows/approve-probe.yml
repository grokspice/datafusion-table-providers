name: approve-probe
on:
  push:
    branches: [sandbox/approve-held-probe]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Open a PR with GITHUB_TOKEN, push twice, approve only the second commit
        shell: bash
        run: |
          set -euo pipefail
          B="probe-child-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name probe; git config user.email probe@example.invalid
          git checkout -b "$B"; date > probe.txt; git add probe.txt; git commit -qm one
          git push -q origin "HEAD:$B"
          gh pr create --base sandbox/approve-held-probe --head "$B" --title "probe $B" --body probe
          OLD_SHA="$(git rev-parse HEAD)"
          sleep 20
          date >> probe.txt; git commit -qam two; git push -q origin "HEAD:$B"
          NEW_SHA="$(git rev-parse HEAD)"
          bash .github/scripts/approve_bot_pr_runs.sh "$B" "$NEW_SHA"
          sleep 40
          echo "OLD $OLD_SHA:"; gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$B&head_sha=$OLD_SHA" --jq '.workflow_runs[]|"  \(.id) \(.event) \(.status) \(.conclusion)"'
          echo "NEW $NEW_SHA:"; gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$B&head_sha=$NEW_SHA" --jq '.workflow_runs[]|"  \(.id) \(.event) \(.status) \(.conclusion)"'
          gh pr close "$B" --delete-branch
