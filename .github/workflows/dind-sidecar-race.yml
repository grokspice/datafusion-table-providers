---
# Reproduction: does a runner container see a Docker daemon when it starts?
# Layout "sibling" runs dockerd as a second regular container, so the kubelet
# starts both at once. Layout "sidecar" runs dockerd as a native sidecar
# (an init container with restartPolicy: Always and a `docker info` startup
# probe), so the runner container starts only after dockerd answers.
name: dind sidecar race
on:
  push:
    branches: [ci-sandbox/dind-sidecar-race]
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PODS: '20'
    steps:
      - uses: actions/checkout@v4
      - name: Create a kind cluster
        run: |
          set -euo pipefail
          curl -fsSL -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.29.0/kind-linux-amd64
          chmod +x kind
          ./kind create cluster --image kindest/node:v1.33.1 --wait 120s
          kubectl version
          # Preload the images so a pull never delays either container.
          docker pull docker:28-dind
          docker pull docker:28-cli
          ./kind load docker-image docker:28-dind docker:28-cli
      - name: Start the pods
        run: |
          set -euo pipefail
          for layout in sibling sidecar; do
            for i in $(seq 1 "$PODS"); do
              sed -e "s/NAME/$layout-$i/" "test/dind-race/$layout.yaml" | kubectl apply -f - > /dev/null
            done
          done
      - name: Collect what each runner container saw at start
        run: |
          set -euo pipefail
          for layout in sibling sidecar; do
            for i in $(seq 1 "$PODS"); do
              kubectl wait --for=condition=Ready "pod/$layout-$i" --timeout=180s > /dev/null
            done
          done
          for layout in sibling sidecar; do
            up=0; down=0
            for i in $(seq 1 "$PODS"); do
              # Poll until the runner has written its first-call verdict.
              line=''
              for _ in $(seq 1 60); do
                line=$(kubectl logs "pod/$layout-$i" -c runner | grep -m1 '^FIRST_CALL=' || true)
                [ -n "$line" ] && break
                sleep 1
              done
              echo "$layout-$i $line $(kubectl logs "pod/$layout-$i" -c runner | grep -m1 '^WAITED_MS=' || true)"
              case "$line" in
                FIRST_CALL=ok) up=$((up+1)) ;;
                FIRST_CALL=fail) down=$((down+1)) ;;
                *) echo "::error::$layout-$i wrote no verdict"; exit 1 ;;
              esac
            done
            echo "SUMMARY layout=$layout pods=$PODS daemon_up_at_start=$up daemon_down_at_start=$down"
          done
