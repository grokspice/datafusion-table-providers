name: rootless-keyring-probe
on:
  push:
    branches: [ci-sandbox/rootless-keyring-quota]
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the arc-runner-dind Dockerfile from the fix branch (1b887bc7a6)
        run: docker build -q -t dind-fix dind
      - name: Baked config and entrypoint flag
        run: |
          set -euxo pipefail
          docker run --rm --entrypoint cat dind-fix /etc/docker/daemon.json
          docker run --rm --entrypoint grep dind-fix -n -- '--config-file' /usr/local/bin/dind-entrypoint
          docker run --rm --entrypoint dockerd dind-fix --version
      - name: dockerd --validate accepts the baked config
        run: docker run --rm --entrypoint dockerd dind-fix --validate --config-file /etc/docker/daemon.json
      - name: Negative control - dockerd --validate rejects a broken runtime config
        run: |
          set +e
          printf '{"default-runtime":"nope","runtimes":{}}' > bad.json
          docker run --rm -v "$PWD/bad.json:/bad.json:ro" --entrypoint dockerd dind-fix --validate --config-file /bad.json
          rc=$?; echo "exit=$rc"; test "$rc" -ne 0
