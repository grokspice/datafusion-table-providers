apiVersion: v1
kind: Pod
metadata:
  name: NAME
spec:
  containers:
    - name: runner
      image: docker:28-cli
      imagePullPolicy: IfNotPresent
      env:
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
      # The first daemon call the Actions runner makes for a job with
      # services or a container, then the time until the daemon answers.
      command:
        - sh
        - -c
        - |
          start=$(date +%s%3N)
          if docker version --format "{{.Server.APIVersion}}" > /dev/null 2>&1; then echo FIRST_CALL=ok; else echo FIRST_CALL=fail; fi
          until docker version > /dev/null 2>&1; do sleep 0.05; done
          echo WAITED_MS=$(( $(date +%s%3N) - start ))
          sleep 3600
      volumeMounts:
        - name: dind-sock
          mountPath: /var/run
    - name: dind
      image: docker:28-dind
      imagePullPolicy: IfNotPresent
      args:
        - dockerd
        - --host=unix:///var/run/docker.sock
      securityContext:
        privileged: true
      volumeMounts:
        - name: dind-sock
          mountPath: /var/run
  volumes:
    - name: dind-sock
      emptyDir: {}
