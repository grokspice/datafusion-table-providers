[workspace]
members = ["core", "crates/common", "python", "crates/odbc", "crates/clickhouse", "crates/flightsql", "crates/mongodb", "crates/mysql", "crates/sqlite", "crates/postgres", "crates/duckdb", "crates/adbc", "crates/oracle"]
resolver = "2"

[workspace.package]
version = "0.13.1"
readme = "README.md"
edition = "2021"
repository = "https://github.com/datafusion-contrib/datafusion-table-providers"
license = "Apache-2.0"
description = "Extend the capabilities of DataFusion to support additional data sources via implementations of the `TableProvider` trait."

[workspace.dependencies]
arrow = "59.2"
arrow-array = { version = "59.2" }
arrow-flight = { version = "59.2", features = [
  "flight-sql-experimental",
  "tls-ring",
  "tls-native-roots",
] }
arrow-ipc = { version = "59.2" }
arrow-schema = { version = "59.2", features = ["serde"] }
arrow-json = "59.2"
arrow-odbc = { version = "25.3" }
datafusion = { version = "55.1", default-features = false }
datafusion-expr = { version = "55.1" }
# crates.io datafusion-federation 0.5.7 already requires datafusion ^55
# (verified via crates.io dependency metadata); no Spice fork bump needed here.
datafusion-federation = { version = "0.5.7" }
datafusion-ffi = { version = "55.1" }
datafusion-proto = { version = "55.1" }
datafusion-physical-expr = { version = "55.1" }
datafusion-physical-plan = { version = "55.1" }
datafusion-python = { version = "55.1" }
datafusion-table-providers = { version = "0.13.1", path = "core" }
datafusion-table-providers-common = { version = "0.13.1", path = "crates/common" }
datafusion-table-providers-odbc = { version = "0.13.1", path = "crates/odbc" }
datafusion-table-providers-clickhouse = { version = "0.13.1", path = "crates/clickhouse" }
datafusion-table-providers-flightsql = { version = "0.13.1", path = "crates/flightsql" }
datafusion-table-providers-mongodb = { version = "0.13.1", path = "crates/mongodb" }
datafusion-table-providers-mysql = { version = "0.13.1", path = "crates/mysql" }
datafusion-table-providers-sqlite = { version = "0.13.1", path = "crates/sqlite" }
datafusion-table-providers-postgres = { version = "0.13.1", path = "crates/postgres" }
datafusion-table-providers-duckdb = { version = "0.13.1", path = "crates/duckdb" }
datafusion-table-providers-adbc = { version = "0.13.1", path = "crates/adbc" }
datafusion-table-providers-oracle = { version = "0.13.1", path = "crates/oracle" }
duckdb = { git = "https://github.com/spiceai/duckdb-rs.git", rev = "875974763e847eb4dc4e071f875f5bbecdd63b47" } # branch: spiceai-1.4.4-patches (duckdb 1.4.4 on arrow 59)
adbc_core = { version = "0.24" }
adbc_driver_manager = { version = "0.24" }
parquet = "59.2"
rusqlite = "0.40"
tokio-rusqlite = "0.7.0"
async-stream = "0.3.5"
async-trait = "0.1.80"
bigdecimal = "0.4.5"
byteorder = "1.5.0"
chrono = "0.4"
futures = "0.3.30"
itertools = "0.14.0"
num-bigint = "0.4"
secrecy = "0.10.3"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.124"
snafu = "0.9"
time = "0.3.36"
tokio = { version = "1.46", features = ["macros", "fs"] }
tracing = "0.1.40"
url = "2.5.1"
rand = "0.9"
regex = "1"
uuid = "1.9.1"
prost = "0.14.1"
tonic = { version = "0.14", features = [
  "tls-native-roots",
  "tls-webpki-roots",
] }
bytes = "1.7.1"
base64 = "0.22.1"
dashmap = "6.1.0"
fallible-iterator = "0.3.0"
fundu = "2.0.1"
geo-types = "0.7.13"
sha2 = "0.10"
hickory-resolver = "0.26"
sea-query = { git = "https://github.com/spiceai/sea-query.git", rev = "985eec78d1a4417b5933e57aac1f39e4470f9473", features = [
  "backend-sqlite",
  "backend-postgres",
  "postgres-array",
  "with-rust_decimal",
  "with-bigdecimal",
  "with-time",
  "with-chrono",
] } # branch: spiceai-1.0.1-patches

[patch.crates-io]
rusqlite = { git = "https://github.com/spiceai/rusqlite.git", rev = "3f98225d35735a61a5875d356774d246a8b0c037" } # spiceai-v0.40.0
tokio-rusqlite = { git = "https://github.com/spiceai/tokio-rusqlite.git", rev = "b10df82e3bbc4f4700562a14a3a00714cbc2f0c7" } # rusqlite 0.40-compatible (matches spiceai/spiceai)

# Spice's datafusion-federation fork carries
# `SQLExecutor::pre_federation_optimizer_rules`, which the adbc provider
# overrides and crates.io 0.5.7 lacks.
datafusion-federation = { git = "https://github.com/spiceai/datafusion-federation.git", rev = "40fefe6426addce7864b80261bdf771ddb19d8ab" } # branch: spiceai-55-patches

# arrow-rs with spice patches (ObjectVersionType + new_with_meta for Azure compatibility).
arrow = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" } # branch: spiceai-59-patches
arrow-arith = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-array = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-buffer = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-cast = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-csv = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-data = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-flight = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-ipc = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-json = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-ord = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-row = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-schema = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-select = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
arrow-string = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
parquet = { git = "https://github.com/spiceai/arrow-rs.git", rev = "16974504b7f1776971f4fb20bbe355b09d090a0d" }
