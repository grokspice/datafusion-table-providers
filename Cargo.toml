[workspace]
members = ["core", "python"]
resolver = "2"

[workspace.package]
version = "0.10.1"
readme = "README.md"
edition = "2021"
repository = "https://github.com/datafusion-contrib/datafusion-table-providers"
license = "Apache-2.0"
description = "Extend the capabilities of DataFusion to support additional data sources via implementations of the `TableProvider` trait."

[workspace.dependencies]
arrow = "59.0"
arrow-array = { version = "59.0" }
arrow-flight = { version = "59.0", features = [
  "flight-sql-experimental",
  "tls-ring",
  "tls-native-roots",
] }
arrow-ipc = { version = "59.0" }
arrow-schema = { version = "59.0", features = ["serde"] }
arrow-json = "59.0"
arrow-odbc = { version = "25.3" }
datafusion = { version = "55.0", default-features = false }
datafusion-expr = { version = "55.0" }
datafusion-federation = { git = "https://github.com/spiceai/datafusion-federation.git", rev = "9ca84a39760d7728bdeb5eac8480a3f9ee8422be" } # branch: viktor/df55-att2/spiceai-55-patches
datafusion-ffi = { version = "55.0" }
datafusion-proto = { version = "55.0" }
datafusion-physical-expr = { version = "55.0" }
datafusion-physical-plan = { version = "55.0" }
datafusion-python = { version = "55.0" }
datafusion-table-providers = { path = "core" }
duckdb = { git = "https://github.com/spiceai/duckdb-rs.git", rev = "8ee430737cb6999025d0b29672ec6cb92df19b6d" } # branch: spiceai-1.4.4-patches (DuckDB v1.4.4, arrow 59)
adbc_core = { version = "0.24" }
adbc_driver_manager = { version = "0.24" }
parquet = "59"
rusqlite = "0.40"
tokio-rusqlite = "0.7.0"
async-stream = "0.3.5"
async-trait = "0.1.80"
bigdecimal = "0.4.5"
byteorder = "1.5.0"
chrono = "0.4"
futures = "0.3.30"
itertools = "0.14.0"
num-bigint = "0.4"
secrecy = "0.10.3"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.124"
snafu = "0.8.3"
time = "0.3.36"
tokio = { version = "1.46", features = ["macros", "fs"] }
tracing = "0.1.40"
url = "2.5.1"
rand = "0.9"
regex = "1"
uuid = "1.9.1"
prost = "0.14.1"
tonic = { version = "0.14", features = [
  "tls-native-roots",
  "tls-webpki-roots",
] }
bytes = "1.7.1"
base64 = "0.22.1"
dashmap = "6.1.0"
fallible-iterator = "0.3.0"
fundu = "2.0.1"
geo-types = "0.7.13"
sha2 = "0.10"
hickory-resolver = "0.26"
sea-query = { git = "https://github.com/spiceai/sea-query.git", rev = "ae75baef819513fb8d19af014972dcfa324e201a", features = [
  "backend-sqlite",
  "backend-postgres",
  "postgres-array",
  "with-rust_decimal",
  "with-bigdecimal",
  "with-time",
  "with-chrono",
] }

[patch.crates-io]
rusqlite = { git = "https://github.com/spiceai/rusqlite.git", rev = "3f98225d35735a61a5875d356774d246a8b0c037" } # spiceai-v0.40.0
tokio-rusqlite = { git = "https://github.com/spiceai/tokio-rusqlite.git", rev = "b10df82e3bbc4f4700562a14a3a00714cbc2f0c7" } # rusqlite 0.40-compatible (matches spiceai/spiceai)

# ADBC 24 with Spice patches — branch: spiceai-24-patches. Spice links this crate against its
# ADBC fork (a statement cancel can reach a running query), so the tests here run against it.
adbc_core = { git = "https://github.com/spiceai/arrow-adbc.git", rev = "3b78b62a286e53a650ddf5bed11fb0feb5ffb79a" }
adbc_driver_manager = { git = "https://github.com/spiceai/arrow-adbc.git", rev = "3b78b62a286e53a650ddf5bed11fb0feb5ffb79a" }
adbc_ffi = { git = "https://github.com/spiceai/arrow-adbc.git", rev = "3b78b62a286e53a650ddf5bed11fb0feb5ffb79a" }

